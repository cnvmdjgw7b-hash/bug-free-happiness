name: Deploy YHN Handbook to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "yhn-live-20261004/**"
      - ".github/workflows/deploy-yhn-handbook-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload handbook
        uses: actions/upload-pages-artifact@v3
        with:
          path: yhn-live-20261004

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
